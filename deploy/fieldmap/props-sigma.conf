# Splunk field aliases, generated by pipeline/build_field_map.py.
#
# Apply on the indexer or the heavy forwarder. Do not hand-edit:
# regenerate from telemetry/field-map.json.
#
# The alias direction matters: `EventCode AS EventID` adds the canonical
# name without removing the platform's. A rule using EventID then works
# and a dashboard using EventCode keeps working.

[WinEventLog:Microsoft-Windows-Sysmon/Operational]
FIELDALIAS-sigma_EventID = EventCode AS EventID
# already native under this name: Computer, Image, CommandLine, ParentImage, ParentCommandLine, ProcessGuid, TargetObject, TargetFilename, TargetImage, SourceImage, GrantedAccess, Details, Type, EventType, Signature, IntegrityLevel, QueryName

[WinEventLog:Security]
FIELDALIAS-sigma_EventID = EventCode AS EventID
# already native under this name: Computer, ObjectName, AccessMask

[squid:access]
FIELDALIAS-sigma_cs_user_agent = cs_user_agent AS cs-user-agent
FIELDALIAS-sigma_cs_uri_stem = cs_uri_stem AS cs-uri-stem
FIELDALIAS-sigma_cs_uri_query = cs_uri_query AS cs-uri-query
FIELDALIAS-sigma_cs_header_X_Id = cs_header_X_Id AS cs-header-X-Id
FIELDALIAS-sigma_cs_header_X_Seq = cs_header_X_Seq AS cs-header-X-Seq
FIELDALIAS-sigma_cs_header_Accept_Language = cs_header_Accept_Language AS cs-header-Accept-Language
FIELDALIAS-sigma_cs_header_Cookie = cs_header_Cookie AS cs-header-Cookie
FIELDALIAS-sigma_SourceAddress = src AS SourceAddress
FIELDALIAS-sigma_DestinationHostname = dest_host AS DestinationHostname
FIELDALIAS-sigma_DestinationPort = dest_port AS DestinationPort
FIELDALIAS-sigma_Process = process_name AS Process

