title: Generic Browser UA with No Accept-Language or Cookie Header
id: 1a2b3c4d-5e6f-4708-9a0b-1c2d3e4f5a13
dedup_key: "rule:1a2b3c4d-5e6f-4708-9a0b-1c2d3e4f5a13:src:dst"
status: experimental
description: HTTP requests advertising Mozilla/5.0 but lacking the Accept-Language and Cookie headers a real browser sends.
author: ghost-detection-lab
date: 2026-11-27
tags: [attack.t1071.001]
tactics: [attack.command-and-control]
references:
  - https://attack.mitre.org/techniques/T1071/001/
  - sigma/beacon_custom_headers.yml
logsource:
  category: proxy
detection:
  selection:
    cs-user-agent: 'Mozilla/5.0'
  absence:
    cs-header-Accept-Language|exists: false
    cs-header-Cookie|exists: false
  condition: selection and absence
falsepositives: [scripts and libraries with hard-coded browser UAs, health checkers]
level: medium
notes: Single-sourced network detection; pair with a host process-owning-socket rule where available.
