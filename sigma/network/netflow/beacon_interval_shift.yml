title: Beacon Interval Shift After Configuration Change
id: 1a2b3c4d-5e6f-4708-9a0b-1c2d3e4f5a14
dedup_key: "rule:1a2b3c4d-5e6f-4708-9a0b-1c2d3e4f5a14:src:dst"
status: experimental
lifecycle: designed
description: >
  A host/destination pair changes its median inter-arrival period by more than
  30 percent while keeping low variance, consistent with an in-memory sleep
  mutation. Sigma cannot express a variance comparison, so this is a member rule
  that keeps the candidate flow set; the distribution test runs in the SIEM
  search documented in docs/sequence-rules.md. It is not a standalone alert.
author: ghost-detection-lab
date: 2026-11-27
sample_ref: PIN-0000
sigma_spec_version: "2.1.0"
dedup_window: "5m"
min_eval_interval: "10s"
min_os: "Windows 10 21H2"
sysmon_min_version: 13
tags: [attack.t1071.001]
tactics:
  - attack.command-and-control
references:
  - https://attack.mitre.org/techniques/T1071/001/
  - docs/sequence-rules.md
logsource:
  category: netflow
detection:
  selection:
    destination_port: 443
  # The candidate set is 443 only, so a filter on any other port can never
  # match: the previous `destination_port: [80, 8080, 8443]` was dead logic that
  # made the rule look tuned when it was not. What actually removes noise from
  # this candidate set is destination *reputation*, which Sigma cannot express -
  # leave the filter to the SIEM job that consumes this rule.
  filter_local_destination:
    DestinationHostname|endswith: ['.local', '.internal', '.corp']
  condition: selection and not filter_local_destination
falsepositives:
  - Anything on 443 - this rule is a candidate filter, not an alert
  - OneDrive/Dropbox sync clients re-polling after a network change or resume
  - Windows Update or Defender signature checks after a missed schedule
  - Any process that has been paused and resumed - the gap is a pause, not a beacon
  - NTP clients compensating for clock drift over a long window
level: low
conversion:
  splunk: supported
  elastic: supported
  kusto: supported
  note: >
    Deliberately carries no threshold. Enable it only as the input to the
    inter-arrival analytics job; alerting on it directly would flood.
