title: autorun.inf Written Outside Trusted Install Paths
id: 9b3f6a12-7c40-4e85-b2d1-5e8a0c4f7d63
dedup_key: "rule:9b3f6a12-7c40-4e85-b2d1-5e8a0c4f7d63:host:user"
status: experimental
description: >
  Detects creation of autorun.inf in user-writable or removable locations, a
  common USB spreading mechanism. Legitimate installers typically write it only
  inside their own Program Files directory.
author: ghost-detection-lab
date: 2026-11-27
tactics: [attack.persistence, attack.lateral-movement]
tags: [attack.t1091, attack.t1547.001]
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 11
    TargetFilename|endswith: '\\autorun.inf'
  filter_trusted:
    TargetFilename|contains:
      - '\\Program Files\\'
      - '\\Program Files (x86)\\'
      - '\\Windows\\'
  condition: selection and not filter_trusted
falsepositives:
  - Legitimate setup media and enterprise imaging tools
level: high
references:
  - https://attack.mitre.org/techniques/T1091/
