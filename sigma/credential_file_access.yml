title: Access to Browser Credential Stores and Wallet Vaults
id: 4e7b1c93-2a58-4d61-9f04-8c6d2e1a7b50
dedup_key: "rule:4e7b1c93-2a58-4d61-9f04-8c6d2e1a7b50:host:user"
status: designed
description: >
  Detects process access or file creation against browser credential databases,
  DPAPI master keys, and cryptocurrency wallet vault paths. Covers the credential
  and wallet collection behavior without relying on static strings.
author: ghost-detection-lab
date: 2026-11-27
sample_ref: PIN-0000
sigma_spec_version: "2.1.0"
dedup_window: "5m"
min_eval_interval: "10s"
min_os: "Windows 10 21H2"
sysmon_min_version: 13
tactics: [attack.credential-access]
tags: [attack.t1555.003, attack.t1533]
logsource:
  product: windows
  service: sysmon
detection:
  sel_access:
    EventID: 10
    TargetFilename|contains:
      - '\\Google\\Chrome\\User Data\\Local State'
      - '\\Microsoft\\Edge\\User Data\\Local State'
      - '\\BraveSoftware\\Brave-Browser\\User Data\\Local State'
      - '\\User Data\\Default\\Login Data'
      - '\\Mozilla\\Firefox\\Profiles\\'
      - '\\Exodus\\exodus.wallet'
      - '\\Electrum\\wallets'
      - '\\Ledger Live'
  sel_copy:
    EventID: 11
    TargetFilename|contains:
      - '_MEI'
      - '\\Local\\Temp\\'
    TargetFilename|endswith:
      - '.db'
      - '.zip'
  filter_browser:
    SourceImage|endswith:
      - '\\chrome.exe'
      - '\\msedge.exe'
      - '\\brave.exe'
      - '\\firefox.exe'
  condition: (sel_access and not filter_browser) or sel_copy
falsepositives:
  - Browser updates and synchronization processes
  - Backup and migration tools
  - Forensic collection by sanctioned IR tooling
level: medium
references:
  - https://attack.mitre.org/techniques/T1555/003/
