title: Access to Browser Credential Stores and Wallet Vaults
id: 4e7b1c93-2a58-4d61-9f04-8c6d2e1a7b50
dedup_key: "rule:4e7b1c93-2a58-4d61-9f04-8c6d2e1a7b50:host:user"
status: experimental
lifecycle: designed
description: >
  A non-browser process reading or copying browser credential databases, DPAPI
  master keys, or cryptocurrency wallet vault files, or staging a copy of a
  database or archive out of a protected directory into Temp. The read half
  previously used Sysmon event 10, which is ProcessAccess and has no
  TargetFilename field, so that selection could never match; it is now Sysmon 11
  FileCreate plus a registry-read branch for DPAPI master keys.
author: ghost-detection-lab
date: 2026-11-27
sample_ref: PIN-0000
sigma_spec_version: "2.1.0"
dedup_window: "5m"
min_eval_interval: "10s"
min_os: "Windows 10 21H2"
sysmon_min_version: 13
tags: [attack.t1555.003, attack.t1005]
tactics:
  - attack.collection
  - attack.credential-access
references:
  - https://attack.mitre.org/techniques/T1555/003/
  - https://attack.mitre.org/techniques/T1005/
  - inventory.md
logsource:
  product: windows
  service: sysmon
detection:
  sel_store_open:
    EventID: 11
    TargetFilename|contains:
      - '\Google\Chrome\User Data\Local State'
      - '\Microsoft\Edge\User Data\Local State'
      - '\BraveSoftware\Brave-Browser\User Data\Local State'
      - '\User Data\Default\Login Data'
      - '\Mozilla\Firefox\Profiles\'
      - '\Exodus\exodus.wallet'
      - '\Electrum\wallets'
      - '\Ledger Live'
  sel_dpapi:
    EventID: 12
    TargetObject|contains: '\Microsoft\Protect\'
  sel_copy:
    EventID: 11
    TargetFilename|endswith:
      - '.db'
      - '.zip'
      - '.wallet'
    TargetFilename|contains: '\AppData\Local\Temp\'
  filter_browser:
    Image|endswith:
      - '\chrome.exe'
      - '\msedge.exe'
      - '\brave.exe'
      - '\firefox.exe'
  filter_backup:
    Image|endswith:
      - '\OneDrive.exe'
      - '\Dropbox.exe'
      - '\veeam.exe'
  condition: ((sel_store_open or sel_dpapi) and not filter_browser and not filter_backup) or sel_copy
falsepositives:
  - Browser updates and synchronization processes
  - Backup and migration tools
  - Forensic collection by sanctioned IR tooling
level: medium
conversion:
  splunk: supported
  elastic: supported
  kusto: supported
  note: >
    Sysmon does not log file reads by default. The store-open branch detects
    creation and modification of credential files, not a stealthy read of an
    existing file - that requires the file-access audit policy or EDR file
    telemetry described in telemetry/data-sources.md.
