  - https://attack.mitre.org/techniques/T1546/003/
  - inventory.md
  - docs/sequence-rules.md
logsource:
  product: windows
  service: sysmon
# The campaign itself is evaluated by analytics/campaign.py (see `campaign:`).
# The four chains it consumes are named by their ids in `campaign.of`.
falsepositives:
  - A hardening script that reads the CPU key, stops a service, creates a WMI subscription, and beacons to a vendor endpoint inside an hour
  - Red-team exercises against the staging environment
  - An SCCM client doing inventory, remediation, subscription repair, and telemetry
level: high
notes: >
  The `condition` for a campaign is expressed in `campaign` below rather than as
  a Sigma correlation clause, because Sigma 2.1 has no "at least N of these
  correlations fired" operator. `analytics/campaign.py` evaluates it, and the
  gate runs it. Pretending Sigma could express this would produce a rule that
  silently means "all four", which is a different and much weaker detector.
campaign:
  require_at_least: 3
  window: 1h
  group_by: Computer
  of:
    recon: 1a2b3c4d-5e6f-4708-9a0b-1c2d3e4f5a05    # CPU read -> security tamper
    persist: 1a2b3c4d-5e6f-4708-9a0b-1c2d3e4f5a03  # WMI subscription triple
    egress: 8f2d5c71-4a90-4e13-b6d8-3c1e7a9f0b52   # beacon frequency
    dns: 5c8e7a21-4d93-4b6f-8e02-1a7f3d9c5b84      # DGA burst
conversion:
  splunk: unsupported
  elastic: unsupported
  kusto: unsupported
  note: >
    No pySigma backend converts a correlation whose members are themselves
    correlations. The four members deploy as their own correlations on Splunk and
    as generated joins on Elastic and Kusto (deploy/joins/); the campaign layer is
    analytics/campaign.py, which is the only implementation and says so.
