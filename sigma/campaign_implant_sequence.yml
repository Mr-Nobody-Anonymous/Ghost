title: Implant Campaign - Recon, Tamper, Persist, and Egress in One Window
id: 7f3c9a21-4b68-4e07-9d15-2c8a6f0e4b93
dedup_key: "rule:7f3c9a21-4b68-4e07-9d15-2c8a6f0e4b93:host"
status: experimental
lifecycle: designed
description: >
  A cross-source campaign correlation. The five existing correlations each prove
  one ordering inside one data source; none of them says "this host did recon,
  then tampering, then persistence, then talked to the internet inside one
  hour". That shape is what separates an implant that got somewhere from a
  tool that ran once, and no single-event rule can express it.

  The rule is deliberately built out of four *chains*, each of which is itself a
  sequence or threshold, and a condition that requires at least three of the
  four to have fired. Requiring all four would be a rule that only fires on a
  complete, textbook intrusion; requiring three keeps it honest about the fact
  that an operator who skips a stage is still an intrusion.

  This is a `1 of` across correlation members rather than a `temporal` across
  single events because the members have different natural join keys (a Python
  child process, a WMI subscription triple, an L2-encrypted beacon). Forcing
  them onto one shared field would be the `ProcessId`-in-a-4663-rule defect
  this repository already fixed once. Grouping is therefore by `Computer`,
  which every member carries.
author: ghost-detection-lab
date: 2026-11-27
sample_ref: PIN-0000
min_os: "Windows 10 21H2"
sigma_spec_version: "2.1.0"
dedup_window: "1h"
min_eval_interval: "60s"
tags: [attack.t1497, attack.t1685, attack.t1546.003, attack.t1071.001]
tactics:
  - attack.command-and-control
  - attack.defense-impairment
  - attack.discovery
  - attack.persistence
  - attack.privilege-escalation
  - attack.stealth
references:
  - https://attack.mitre.org/techniques/T1497/
