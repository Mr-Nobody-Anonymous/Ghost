title: AMSI or ETW Function Patch (Process Access to ntdll/amsi)
id: 7a1c3e40-9b12-4d6e-8f21-0c3b5a9d7e11
dedup_key: "rule:7a1c3e40-9b12-4d6e-8f21-0c3b5a9d7e11:host:user"
status: experimental
description: >
  Detects a process obtaining writable/read-write access to amsi.dll or ntdll.dll,
  consistent with in-memory patching of AmsiScanBuffer or EtwEventWrite. A second
  selection covers remote threads started in those modules.
author: ghost-detection-lab
date: 2026-11-27
tactics: [attack.defense-evasion]
tags: [attack.t1562.001]
logsource:
  product: windows
  service: sysmon
detection:
  sel_access:
    EventID: 10
    TargetImage|endswith:
      - '\amsi.dll'
      - '\ntdll.dll'
    GrantedAccess|contains:
      - '0x001F0FFF'
      - '0x001F1FFF'
      - '0x001F2FFF'
      - '0x001F3FFF'
      - '0x001F4000'
      - '0x001F401F'
  sel_remote_thread:
    EventID: 8
    TargetImage|endswith:
      - '\amsi.dll'
      - '\ntdll.dll'
  filter_legit:
    SourceImage|endswith:
      - '\lsass.exe'
      - '\MsMpEng.exe'
      - '\SecurityHealthService.exe'
      - '\csrss.exe'
  condition: (sel_access or sel_remote_thread) and not filter_legit
falsepositives:
  - Security products and debuggers that legitimately hook or inspect these modules
  - Application compatibility tooling
  - Endpoint agents performing their own inline hooks
level: high
references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://learn.microsoft.com/windows/win32/api/memoryapi/nf-memoryapi-virtualprotect
