title: Executable Launched from User-Writable Path with No Signer
id: 1a2b3c4d-5e6f-4708-9a0b-1c2d3e4f5a06
dedup_key: "rule:1a2b3c4d-5e6f-4708-9a0b-1c2d3e4f5a06:host:user"
status: experimental
lifecycle: designed
description: >
  Process creation from a user-writable staging path (Temp, Downloads, or a
  per-user _MEI extraction directory) where Sysmon could not resolve a
  signature. Sysmon 1 exposes Signature and SignatureStatus, so "unsigned" is a
  field test rather than an assumption; the original draft selected every
  process under Temp and relied on an Image-name allowlist, which is unbounded.
author: ghost-detection-lab
date: 2026-11-27
sample_ref: PIN-0000
sigma_spec_version: "2.1.0"
dedup_window: "5m"
min_eval_interval: "10s"
min_os: "Windows 10 21H2"
sysmon_min_version: 13
tags: [attack.t1105, attack.t1027.002]
tactics:
  - attack.command-and-control
  - attack.stealth
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://attack.mitre.org/techniques/T1027/002/
  - inventory.md
logsource:
  product: windows
  service: sysmon
detection:
  selection_path:
    EventID: 1
    Image|contains:
      - '\AppData\Local\Temp\'
      - '\Downloads\'
      - '\_MEI'
  selection_role:
    IntegrityLevel: Medium
  filter_signed:
    Signature: 'Microsoft Windows'
  filter_known_dirs:
    Image|contains:
      - '\AppData\Local\Microsoft\'
      - '\AppData\Local\Packages\'
  condition: selection_path and selection_role and not filter_signed and not filter_known_dirs
falsepositives:
  - Portable tools run from a Downloads folder
  - Self-extracting installers that unpack into Temp
  - Vendor agents that update themselves through a per-user installer
level: medium
conversion:
  splunk: supported
  elastic: supported
  kusto: supported
  note: >
    Signature and IntegrityLevel are only populated when Sysmon has signature
    checking enabled; confirm they appear in the clean baseline before relying
    on the filter.
