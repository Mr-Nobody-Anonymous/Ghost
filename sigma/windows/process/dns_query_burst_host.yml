title: Host Process Resolving Many Random Labels
id: 1a2b3c4d-5e6f-4708-9a0b-1c2d3e4f5a0e
dedup_key: "rule:1a2b3c4d-5e6f-4708-9a0b-1c2d3e4f5a0e:host:process"
status: experimental
lifecycle: designed
description: >
  One process resolves more than twenty long pseudo-random labels in five
  minutes, the host-side twin of the DGA NXDOMAIN rule. Rewritten from the
  deprecated `selection | count() by ProcessGuid > 20` pipe into an event_count
  correlation so pySigma accepts it.
author: ghost-detection-lab
date: 2026-11-27
sample_ref: PIN-0000
sigma_spec_version: "2.1.0"
dedup_window: "5m"
min_eval_interval: "10s"
min_os: "Windows 10 21H2"
sysmon_min_version: 13
tags: [attack.t1568.002]
tactics:
  - attack.command-and-control
references:
  - https://attack.mitre.org/techniques/T1568/002/
  - network/ja3-x509.md
logsource:
  product: windows
correlation:
  type: event_count
  rules:
    - 0b6a2f19-8d34-4c72-9e51-3a7d5f0c2b84
  group-by:
    - ProcessGuid
  timespan: 5m
  condition:
    gte: 20
falsepositives:
  - CDN clients, telemetry agents, DNS security probes
  - Browsers resolving the same CDN hostname across many processes at load
  - Package managers (pip, npm, Chocolatey) resolving a mirror fleet at start
  - DNS-over-HTTPS resolvers or VPN clients re-querying after a tunnel change
  - Any host behind a flaky link: retries inflate the count without a beacon
level: medium
notes: >
  Covers the DGA fallback only; the primary C2 path uses IP literals and never
  performs DNS.
conversion:
  splunk: supported
  elastic: unsupported
  kusto: unsupported
  note: correlation rules convert only through the Splunk backend
