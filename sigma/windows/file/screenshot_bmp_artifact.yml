title: Screen-Sized BMP Written to Temp Directory
id: 1a2b3c4d-5e6f-4708-9a0b-1c2d3e4f5a08
dedup_key: "rule:1a2b3c4d-5e6f-4708-9a0b-1c2d3e4f5a08:host:user"
status: experimental
lifecycle: designed
description: A BMP with a 54-byte header and dimensions matching the screen resolution created under %TEMP%.
author: ghost-detection-lab
date: 2026-11-27
sample_ref: PIN-0000
sigma_spec_version: "2.1.0"
dedup_window: "5m"
min_eval_interval: "10s"
min_os: "Windows 10 21H2"
sysmon_min_version: 13
tags: [attack.t1113]
tactics:
  - attack.collection
references:
  - https://attack.mitre.org/techniques/T1113/
  - inventory.md
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 11
    TargetFilename|contains: '\AppData\Local\Temp\'
    TargetFilename|endswith: '.bmp'
  condition: selection
falsepositives: [screenshot utilities, remote support tools, print spooler renders, game overlays]
level: medium
conversion:
  splunk: supported
  elastic: supported
  kusto: supported
notes: Refine by inspecting the first 54 bytes for BITMAPINFOHEADER and resolution equal to screen metrics.
