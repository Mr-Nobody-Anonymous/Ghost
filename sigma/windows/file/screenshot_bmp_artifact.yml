title: Screen-Sized BMP Written to Temp Directory
id: 1a2b3c4d-5e6f-4708-9a0b-1c2d3e4f5a08
dedup_key: "rule:1a2b3c4d-5e6f-4708-9a0b-1c2d3e4f5a08:host:user"
status: experimental
lifecycle: designed
description: >
  A `.bmp` written under a user Temp directory. Sysmon 11 exposes only the file
  create, not its contents, so this cannot verify the BITMAPINFOHEADER or that
  the dimensions match the screen; it is a filename/shape signal and is rated
  medium for that reason. Use the YARA `BMP` module or an EDR file-read sensor for
  the stronger claim.
author: ghost-detection-lab
date: 2026-11-27
sample_ref: PIN-0000
sigma_spec_version: "2.1.0"
dedup_window: "5m"
min_eval_interval: "10s"
min_os: "Windows 10 21H2"
sysmon_min_version: 13
tags: [attack.t1113]
tactics:
  - attack.collection
references:
  - https://attack.mitre.org/techniques/T1113/
  - inventory.md
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 11
    TargetFilename|contains: '\AppData\Local\Temp\'
    TargetFilename|endswith: '.bmp'
  condition: selection
falsepositives: [screenshot utilities, remote support tools, print spooler renders, game overlays]
level: medium
conversion:
  splunk: supported
  elastic: supported
  kusto: supported
notes: Sysmon 11 does not carry file contents. The 54-byte-BITMAPINFOHEADER and screen-dimension checks require a file collection step (see analysis/iocs.md) and are not part of this rule. A generic Temp .bmp is common (clipboard tools, print spooler); tune against the benign corpus before promoting.
fixture_ref: fixtures/per_rule/1a2b3c4d-5e6f-4708-9a0b-1c2d3e4f5a08.json
