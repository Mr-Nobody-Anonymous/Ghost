description: >
  All three WMI subscription objects - event filter, command-line consumer and
  binding - created under root\subscription for the same user inside one short
  window. A single object is common (SCCM, Intune, endpoint agents); the triple
  is the persistence shape. Member rules each convert to every backend; the
  temporal join converts only through the Splunk backend.
