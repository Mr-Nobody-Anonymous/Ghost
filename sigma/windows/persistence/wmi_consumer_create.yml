title: WMI Command-Line Event Consumer Created Under root\subscription
id: 7c4f9e02-5b83-4d61-a0f2-8e1d3c6b9a74
dedup_key: "rule:7c4f9e02-5b83-4d61-a0f2-8e1d3c6b9a74:host:user"
status: experimental
lifecycle: designed
description: >
  Sysmon event 20 - a permanent WMI consumer was registered. A
  CommandLineEventConsumer is the half that actually executes a command at
  trigger time, which is why it carries higher signal than the filter alone.
author: ghost-detection-lab
date: 2026-11-27
sample_ref: PIN-0000
sigma_spec_version: "2.1.0"
dedup_window: "5m"
min_eval_interval: "10s"
min_os: "Windows 10 21H2"
sysmon_min_version: 13
tags: [attack.t1546.003]
tactics:
  - attack.persistence
  - attack.privilege-escalation
references:
  - https://attack.mitre.org/techniques/T1546/003/
  - https://learn.microsoft.com/windows/win32/wmisdk/commandlineeventconsumer
logsource:
  product: windows
  service: sysmon
detection:
  selection_consumer:
    EventID: 20
    Computer|exists: true
    Type|contains: 'CommandLineEventConsumer'
  condition: selection_consumer
falsepositives:
  - SCCM, Intune, monitoring agents
  - Endpoint agents that use WMI to self-heal
level: medium
conversion:
  splunk: supported
  elastic: supported
  kusto: supported
