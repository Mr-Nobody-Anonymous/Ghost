title: Script Written to User Startup Folder
id: 1a2b3c4d-5e6f-4708-9a0b-1c2d3e4f5a04
dedup_key: "rule:1a2b3c4d-5e6f-4708-9a0b-1c2d3e4f5a04:host:user"
status: experimental
lifecycle: designed
description: A .cmd/.bat/.lnk file created in the user Startup folder by a non-installer process.
author: ghost-detection-lab
date: 2026-11-27
sample_ref: PIN-0000
sigma_spec_version: "2.1.0"
dedup_window: "5m"
min_eval_interval: "10s"
min_os: "Windows 10 21H2"
sysmon_min_version: 13
tags: [attack.t1547.001]
tactics:
  - attack.persistence
  - attack.privilege-escalation
references:
  - https://attack.mitre.org/techniques/T1547.001/
  - inventory.md
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 11
    TargetFilename|contains: '\Start Menu\Programs\Startup\'
    TargetFilename|endswith: ['.cmd', '.bat', '.lnk', '.vbs', '.ps1']
  filter_installer:
    Image|endswith: ['\msiexec.exe', '\setup.exe']
  condition: selection and not filter_installer
falsepositives: [legitimate startup shortcuts created by installers]
level: medium
conversion:
  splunk: supported
  elastic: supported
  kusto: supported
fixture_ref: fixtures/per_rule/1a2b3c4d-5e6f-4708-9a0b-1c2d3e4f5a04.json
