title: WMI Filter-to-Consumer Binding Created Under root\subscription
id: 9e0d4b71-6c25-4f38-b7a9-2d5e8c1f0a63
dedup_key: "rule:9e0d4b71-6c25-4f38-b7a9-2d5e8c1f0a63:host:user"
status: experimental
lifecycle: designed
description: >
  Sysmon event 21 - an event filter was bound to a consumer. This is the step
  that arms a WMI subscription; without a binding nothing executes. Member rule
  of the WMI triple sequence.
author: ghost-detection-lab
date: 2026-11-27
sample_ref: PIN-0000
sigma_spec_version: "2.1.0"
dedup_window: "5m"
min_eval_interval: "10s"
min_os: "Windows 10 21H2"
sysmon_min_version: 13
tags: [attack.t1546.003]
tactics:
  - attack.persistence
  - attack.privilege-escalation
references:
  - https://attack.mitre.org/techniques/T1546/003/
  - https://learn.microsoft.com/windows/win32/wmisdk/binding-an-event-filter-with-a-logical-consumer
logsource:
  product: windows
  service: sysmon
detection:
  selection:
    EventID: 21
    Computer|exists: true
  condition: selection
falsepositives:
  - SCCM, Intune, monitoring agents
level: medium
conversion:
  splunk: supported
  elastic: supported
  kusto: supported
