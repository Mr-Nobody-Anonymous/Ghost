title: Beacon with Custom X-Id / X-Seq Headers
id: 2d7f4b90-8e31-4c5a-b2d6-9f1a0c3e7d52
dedup_key: "rule:2d7f4b90-8e31-4c5a-b2d6-9f1a0c3e7d52:host:user"
status: experimental
lifecycle: designed
description: >
  Detects outbound HTTP(S) requests carrying BOTH non-standard headers X-Id and
  X-Seq, or a request whose URI path is /poll with id= and seq= query terms under
  a browser-looking user agent. The original draft used `cs-uri-stem|endswith:
  '/poll'` with a conjunctive URI query, which never fired on the /poll?id=&seq=
  shape it was written for.
author: ghost-detection-lab
date: 2026-11-27
sample_ref: PIN-0000
sigma_spec_version: "2.1.0"
dedup_window: "5m"
min_eval_interval: "10s"
min_os: "Windows 10 21H2"
sysmon_min_version: 13
tags: [attack.t1071.001]
tactics: [attack.command-and-control]
references:
  - https://attack.mitre.org/techniques/T1071/001/
  - network/ja3-x509.md
logsource:
  category: proxy
detection:
  sel_headers:
    cs-header-X-Id|exists: true
    cs-header-X-Seq|exists: true
    SourceAddress|exists: true
    DestinationHostname|exists: true
  sel_uri:
    cs-uri-query|contains|all:
      - 'id='
      - 'seq='
  sel_path:
    cs-uri-stem|endswith: '/poll'
    SourceAddress|exists: true
    DestinationHostname|exists: true
  sel_ua:
    cs-user-agent|startswith: 'Mozilla/5.0'
  condition: sel_headers or (sel_path and sel_uri and sel_ua)
falsepositives:
  - Internal applications that use similarly named custom headers
  - Misconfigured monitoring agents
level: high
conversion:
  splunk: supported
  elastic: supported
  kusto: supported
