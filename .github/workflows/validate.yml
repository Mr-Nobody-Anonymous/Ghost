name: gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation and conversion dependencies
        run: python -m pip install --upgrade pip pyyaml yara-python sigma-cli sigma-backend-splunk sigma-backend-kql
      - name: Run the full gate (same command a stranger runs locally)
        run: bash ci/gate.sh

  # The gate is intentionally allowed to fail: conversion of correlation rules
  # is a known, recorded gap. See docs/maturity.md. Do not weaken this job.
