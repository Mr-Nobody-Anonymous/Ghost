name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pyyaml yara-python
      - name: Validate rule schema and duplicate keys
        run: python3 detection-as-code/validate_rules.py
      - name: Run rule and contract tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Generate coverage matrix
        run: python3 tools/generate_matrix.py

  # Backend conversion is intentionally a separate, hard gate (ci/convert_check.py).
  # It is not run here until pySigma Splunk/KQL backends are installed and the
  # conversion risks on correlation rules have been resolved. See docs/maturity.md.
